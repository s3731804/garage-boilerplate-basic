services:
  scanner-proof:
    build: .
    network_mode: none
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    environment:
      SCANNER_DRY_RUN: "true"
    # No host mounts, env_file, Trust Page network or database credentials.
